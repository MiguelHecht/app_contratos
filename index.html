<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Contrato - Curso Albert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 50px; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header-bg { background-color: #0d6efd; color: white; padding: 20px; border-radius: 10px 10px 0 0; }
        .secao-titulo { color: #0d6efd; border-bottom: 2px solid #e9ecef; padding-bottom: 5px; margin-bottom: 15px; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="container mt-4" style="max-width: 900px;">
        <div class="card">
            <div class="header-bg text-center">
                <h3>Gerador de Contrato de Matrícula</h3>
                <p class="mb-0">Curso Albert - Ano Letivo 2026</p>
            </div>
            <div class="card-body p-4">
                <form action="/gerar-contrato/" method="post">
                    
                    <!-- 1. DADOS DO CONTRATANTE -->
                    <h5 class="secao-titulo">1. Dados do Responsável (Contratante)</h5>
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Nome Completo:</label>
                            <input type="text" name="nome_contratante" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">CPF:</label>
                            <input type="text" name="cpf_contratante" class="form-control" placeholder="000.000.000-00" oninput="mascaraCPF(this)" maxlength="14" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Data Nasc.:</label>
                            <input type="date" id="nascimento_contratante_picker" class="form-control" onchange="atualizarDatasNascimentoBR()">
                            <input type="hidden" id="nascimento_contratante_hidden" name="nascimento_contratante">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Estado Civil:</label>
                            <select name="estado_civil" class="form-select">
                                <option value="Solteiro(a)">Solteiro(a)</option>
                                <option value="Casado(a)">Casado(a)</option>
                                <option value="Divorciado(a)">Divorciado(a)</option>
                                <option value="Viúvo(a)">Viúvo(a)</option>
                                <option value="União Estável">União Estável</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Profissão:</label>
                            <input type="text" name="profissao" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">E-mail:</label>
                            <input type="email" name="email_contratante" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Telefone(s):</label>
                            <input type="text" name="telefone_contratante" class="form-control">
                        </div>
                        <div class="col-md-9">
                            <label class="form-label">Endereço Completo:</label>
                            <input type="text" name="endereco" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">CEP:</label>
                            <input type="text" name="cep" class="form-control" placeholder="00000-000" oninput="mascaraCEP(this)" maxlength="9">
                        </div>
                    </div>

                    <!-- 2. DADOS DO ALUNO -->
                    <h5 class="secao-titulo">2. Dados do Aluno</h5>
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Nome Completo do Aluno:</label>
                            <input type="text" name="nome_aluno" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Data Nasc. Aluno:</label>
                            <input type="date" id="nascimento_aluno_picker" class="form-control" onchange="atualizarDatasNascimentoBR()">
                            <input type="hidden" id="nascimento_aluno_hidden" name="nascimento_aluno">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Telefone Aluno:</label>
                            <input type="text" name="telefone_aluno" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">E-mail Aluno:</label>
                            <input type="email" name="email_aluno" class="form-control">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Escola:</label>
                            <input type="text" name="escola" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Série:</label>
                            <input type="text" name="serie" class="form-control">
                        </div>
                    </div>

                    <!-- 3. PLANO E PAGAMENTO -->
                    <h5 class="secao-titulo">3. Pacote e Pagamento</h5>
                    <div class="row g-3">
                        
                        <!-- SELEÇÃO DE PACOTES -->
                        <div class="col-md-6">
                            <label class="form-label">Pacote Escolhido:</label>
                            <select id="pacote_select" class="form-select" onchange="atualizarPagamento()">
                                <option value="Pacote Essencial">Pacote Essencial</option>
                                <option value="Pacote Intermediario">Pacote Intermediário</option>
                                <option value="Pacote Premium">Pacote Premium</option>
                            </select>
                        </div>

                        <!-- COMPLEMENTO DO PACOTE (OPCIONAL) -->
                        <div class="col-md-6">
                            <label class="form-label">Complemento / Desconto (Opcional):</label>
                            <input type="text" id="complemento_pacote" class="form-control" placeholder="ex: com desconto para aluno IESE" oninput="atualizarPagamento()">
                        </div>

                        <!-- Forma de Pagamento -->
                        <div class="col-md-4">
                            <label class="form-label">Tipo de Pagamento:</label>
                            <select id="tipo_pagamento" class="form-select" onchange="atualizarPagamento()">
                                <option value="credito">Cartão de Crédito</option>
                                <option value="recorrencia">Recorrência / Assinatura</option>
                                <option value="boleto">Boleto Bancário</option>
                                <option value="vista">À Vista (PIX / Dinheiro / Débito)</option>
                            </select>
                        </div>

                        <!-- Número de Parcelas -->
                        <div class="col-md-4" id="div_select_parcelas">
                            <label class="form-label">Quantidade de Parcelas:</label>
                            <select id="qtd_parcelas_select" class="form-select" onchange="atualizarPagamento()">
                                <option value="12">12x (doze vezes)</option>
                                <option value="11">11x (onze vezes)</option>
                                <option value="10">10x (dez vezes)</option>
                                <option value="9">9x (nove vezes)</option>
                                <option value="8">8x (oito vezes)</option>
                                <option value="7">7x (sete vezes)</option>
                                <option value="6">6x (seis vezes)</option>
                                <option value="5">5x (cinco vezes)</option>
                                <option value="4">4x (quatro vezes)</option>
                                <option value="3">3x (três vezes)</option>
                                <option value="2">2x (duas vezes)</option>
                            </select>
                        </div>

                        <!-- Isenção de Matrícula -->
                        <div class="col-md-4">
                            <label class="form-label">Isenção da Taxa de Matrícula?</label>
                            <select id="isencao_select" class="form-select" onchange="atualizarPagamento()">
                                <option value="sim">Sim (com isenção da taxa de matrícula)</option>
                                <option value="nao">Não (sem isenção)</option>
                            </select>
                        </div>

                        <!-- Valor Total -->
                        <div class="col-md-12">
                            <label class="form-label">Valor Total do Curso (R$):</label>
                            <input type="text" id="valor_total_input" name="valor_total" class="form-control" placeholder="2.256,00" oninput="atualizarPagamento()" required>
                        </div>

                        <!-- Campos ocultos enviados para o backend -->
                        <input type="hidden" id="descricao_pacote_hidden" name="descricao_pacote">
                        <input type="hidden" id="forma_pagamento_hidden" name="forma_pagamento">
                        <input type="hidden" id="detalhe_isencao_hidden" name="detalhe_isencao">
                        <input type="hidden" id="num_parcelas_hidden" name="num_parcelas">

                        <!-- Campos formatados em BR que serão enviados ao Python -->
                        <input type="hidden" id="data_primeira_parcela_hidden" name="data_primeira_parcela">
                        <input type="hidden" id="data_ultima_parcela_hidden" name="data_ultima_parcela">

                        <!-- Campos calculados dinamicamente (Área de Parcelamento) -->
                        <div id="area_parcelas" class="row g-3 mt-1">
                            <div class="col-md-4">
                                <label class="form-label">Valor da Parcela (R$):</label>
                                <input type="text" id="valor_parcela" name="valor_parcela" class="form-control" readonly>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">1ª Parcela (Início):</label>
                                <input type="date" id="data_primeira_parcela" class="form-control" onchange="recalcularParcelasEVigencia()">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Última Parcela (Fim):</label>
                                <input type="date" id="data_ultima_parcela" class="form-control" onchange="atualizarDataUltimaManual()">
                            </div>
                        </div>
                    </div>

                    <!-- 4. VIGÊNCIA DO CONTRATO -->
                    <h5 class="secao-titulo">4. Vigência do Contrato</h5>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Mês Início:</label>
                            <select id="mes_inicio" name="mes_inicio" class="form-select" onchange="calcularVigenciaFimPadrao()">
                                <option value="janeiro">Janeiro</option>
                                <option value="fevereiro">Fevereiro</option>
                                <option value="março">Março</option>
                                <option value="abril" selected>Abril</option>
                                <option value="maio">Maio</option>
                                <option value="junho">Junho</option>
                                <option value="julho">Julho</option>
                                <option value="agosto">Agosto</option>
                                <option value="setembro">Setembro</option>
                                <option value="outubro">Outubro</option>
                                <option value="novembro">Novembro</option>
                                <option value="dezembro">Dezembro</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Ano Início:</label>
                            <input type="text" id="ano_inicio" name="ano_inicio" class="form-control" value="2026" oninput="calcularVigenciaFimPadrao()">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Mês Fim:</label>
                            <select id="mes_fim" name="mes_fim" class="form-select">
                                <option value="janeiro">Janeiro</option>
                                <option value="fevereiro">Fevereiro</option>
                                <option value="março">Março</option>
                                <option value="abril">Abril</option>
                                <option value="maio">Maio</option>
                                <option value="junho">Junho</option>
                                <option value="julho">Julho</option>
                                <option value="agosto">Agosto</option>
                                <option value="setembro">Setembro</option>
                                <option value="outubro">Outubro</option>
                                <option value="novembro">Novembro</option>
                                <option value="dezembro">Dezembro</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Ano Fim:</label>
                            <input type="text" id="ano_fim" name="ano_fim" class="form-control" value="2027">
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg">Gerar e Baixar Contrato (.docx)</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MÁSCARAS E LÓGICA DE INTEGRAÇÃO EM JAVASCRIPT -->
    <script>
        const meses = [
            "janeiro", "fevereiro", "março", "abril", "maio", "junho",
            "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"
        ];

        const extensoNumeros = {
            1: "1 (uma)", 2: "2 (duas)", 3: "3 (três)", 4: "4 (quatro)",
            5: "5 (cinco)", 6: "6 (seis)", 7: "7 (sete)", 8: "8 (oito)",
            9: "9 (nove)", 10: "10 (dez)", 11: "11 (onze)", 12: "12 (doze)"
        };

        // MÁSCARAS DE TEXTO
        function mascaraCPF(input) {
            let v = input.value.replace(/\D/g, "");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            input.value = v;
        }

        function mascaraCEP(input) {
            let v = input.value.replace(/\D/g, "");
            v = v.replace(/^(\d{5})(\d)/, "$1-$2");
            input.value = v;
        }

        // AUXILIARES DE DATA
        function isoParaBR(dataISO) {
            if (!dataISO) return '-';
            let partes = dataISO.split('-');
            if (partes.length === 3) {
                return `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
            return '-';
        }

        function dateParaISO(dataObj) {
            let ano = dataObj.getFullYear();
            let mes = String(dataObj.getMonth() + 1).padStart(2, '0');
            let dia = String(dataObj.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        }

        // CONVERTE DATAS DE NASCIMENTO PARA DD/MM/AAAA
        function atualizarDatasNascimentoBR() {
            let dtContratante = document.getElementById('nascimento_contratante_picker').value;
            let dtAluno = document.getElementById('nascimento_aluno_picker').value;

            document.getElementById('nascimento_contratante_hidden').value = isoParaBR(dtContratante);
            document.getElementById('nascimento_aluno_hidden').value = isoParaBR(dtAluno);
        }

        // VIGÊNCIA PADRÃO (12 MESES)
        function calcularVigenciaFimPadrao() {
            const mesInicioNome = document.getElementById('mes_inicio').value;
            const anoInicioVal = parseInt(document.getElementById('ano_inicio').value);

            const indexInicio = meses.indexOf(mesInicioNome.toLowerCase());
            if (indexInicio !== -1 && !isNaN(anoInicioVal)) {
                const indexFim = (indexInicio + 11) % 12;
                let anoFimVal = anoInicioVal;
                if (indexFim < indexInicio) {
                    anoFimVal += 1;
                }
                document.getElementById('mes_fim').value = meses[indexFim];
                document.getElementById('ano_fim').value = anoFimVal;
            }
        }

        // RECALCULAR PARCELAS E VIGÊNCIA
        function recalcularParcelasEVigencia() {
            let valPrimeira = document.getElementById('data_primeira_parcela').value;
            let qtdParcelas = parseInt(document.getElementById('qtd_parcelas_select').value);

            if (valPrimeira) {
                let partes = valPrimeira.split('-');
                let dtPrimeira = new Date(partes[0], partes[1] - 1, partes[2]);

                // Calcula última parcela: + (qtdParcelas - 1) meses
                let dtUltima = new Date(dtPrimeira.getFullYear(), dtPrimeira.getMonth() + (qtdParcelas - 1), dtPrimeira.getDate());
                
                let isoUltima = dateParaISO(dtUltima);
                document.getElementById('data_ultima_parcela').value = isoUltima;

                // Atualiza os Hiddens em formato DD/MM/AAAA para envio ao Python
                document.getElementById('data_primeira_parcela_hidden').value = isoParaBR(valPrimeira);
                document.getElementById('data_ultima_parcela_hidden').value = isoParaBR(isoUltima);

                // Sincroniza Vigência Início
                document.getElementById('mes_inicio').value = meses[dtPrimeira.getMonth()];
                document.getElementById('ano_inicio').value = dtPrimeira.getFullYear();

                // Se for 12x, sincroniza a Vigência Fim com a Última Parcela
                if (qtdParcelas === 12) {
                    document.getElementById('mes_fim').value = meses[dtUltima.getMonth()];
                    document.getElementById('ano_fim').value = dtUltima.getFullYear();
                } else {
                    calcularVigenciaFimPadrao();
                }
            }
        }

        function atualizarDataUltimaManual() {
            let valUltima = document.getElementById('data_ultima_parcela').value;
            document.getElementById('data_ultima_parcela_hidden').value = isoParaBR(valUltima);
        }

        function atualizarPagamento() {
            // 1. Pacote
            const pacoteBase = document.getElementById('pacote_select').value;
            const complemento = document.getElementById('complemento_pacote').value.trim();
            document.getElementById('descricao_pacote_hidden').value = complemento !== "" ? `${pacoteBase} ${complemento}` : pacoteBase;

            // 2. Pagamento
            const tipo = document.getElementById('tipo_pagamento').value;
            const isencao = document.getElementById('isencao_select').value;
            const valorTotalStr = document.getElementById('valor_total_input').value;
            const qtdParcelas = parseInt(document.getElementById('qtd_parcelas_select').value);

            const areaParcelas = document.getElementById('area_parcelas');
            const divSelectParcelas = document.getElementById('div_select_parcelas');
            
            document.getElementById('detalhe_isencao_hidden').value = (isencao === 'sim') ? 'com isenção da taxa de matrícula' : 'sem isenção da taxa de matrícula';

            if (tipo === 'vista') {
                areaParcelas.style.display = 'none';
                divSelectParcelas.style.display = 'none';
                document.getElementById('forma_pagamento_hidden').value = 'à vista';
                document.getElementById('num_parcelas_hidden').value = '1 (uma)';
                document.getElementById('valor_parcela').value = valorTotalStr;
                document.getElementById('data_primeira_parcela_hidden').value = '-';
                document.getElementById('data_ultima_parcela_hidden').value = '-';
                return;
            }

            areaParcelas.style.display = 'flex';
            divSelectParcelas.style.display = 'block';

            let textoQtdExtenso = extensoNumeros[qtdParcelas] || `${qtdParcelas}x`;
            document.getElementById('num_parcelas_hidden').value = textoQtdExtenso;

            if (tipo === 'credito') {
                document.getElementById('forma_pagamento_hidden').value = `parcelado em ${textoQtdExtenso} vezes no cartão de crédito`;
            } else if (tipo === 'recorrencia') {
                document.getElementById('forma_pagamento_hidden').value = `parcelado em ${textoQtdExtenso} vezes via recorrência cartão`;
            } else if (tipo === 'boleto') {
                document.getElementById('forma_pagamento_hidden').value = `parcelado em ${textoQtdExtenso} vezes no boleto bancário`;
            }

            // Define data padrão de hoje se estiver limpo
            let campoPrimeira = document.getElementById('data_primeira_parcela');
            if (!campoPrimeira.value) {
                campoPrimeira.value = dateParaISO(new Date());
            }
            
            recalcularParcelasEVigencia();

            let valorLimpo = valorTotalStr.replace(/\./g, '').replace(',', '.');
            let valorNum = parseFloat(valorLimpo);

            if (!isNaN(valorNum) && valorNum > 0) {
                let parcela = (valorNum / qtdParcelas).toFixed(2);
                document.getElementById('valor_parcela').value = parcela.replace('.', ',');
            } else {
                document.getElementById('valor_parcela').value = '';
            }
        }

        window.onload = function() {
            atualizarPagamento();
            atualizarDatasNascimentoBR();
        };
    </script>
</body>
</html>
